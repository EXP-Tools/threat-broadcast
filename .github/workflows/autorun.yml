name: Automatically crawl CVEs

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]
    paths:
      - '.github/workflows/**'
      - 'main.py'
      - 'src/**'
      - 'tests/**'
      - 'config/**'
      - 'requirements.txt'
  workflow_dispatch:
    inputs:
      check_only:
        description: 'Only check sources; do not update data or generate notifications'
        type: boolean
        default: true
  schedule:
    - cron: '0 0/3 * * *'

permissions:
  contents: read

concurrency:
  group: cves-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repo
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt
      - name: Check dependencies
        run: python -m pip check
      - name: Run regression tests
        run: python -m unittest discover -s tests -v
      - name: Check CLI imports
        run: python main.py --help

  build-and-deploy:
    needs: validate
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    concurrency:
      group: cves-publish-master
      cancel-in-progress: false
    steps:
      - name: Check out repo
        uses: actions/checkout@v7
        with:
          ref: master
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt
      - name: Check sources
        if: github.event_name == 'workflow_dispatch' && inputs.check_only
        run: python main.py --check
      - name: Crawl CVEs
        if: github.event_name == 'schedule' || !inputs.check_only
        env:
          CRAWL_PWD: ${{ secrets.CRAWL_PWD }}
          GTK: ${{ secrets.GRAPHQL_TOKEN || secrets.GRAPAQL_TOKEN || github.token }}
        run: |
          if [ -z "$CRAWL_PWD" ]; then
            echo "::notice::CRAWL_PWD is not configured; scheduled collection is disabled."
            exit 0
          fi
          python main.py -g "$CRAWL_PWD" --gtk "$GTK"
      - name: Commit and push generated files
        if: github.event_name == 'schedule' || !inputs.check_only
        run: |
          git config user.email "github-bot@example.com"
          git config user.name "Github-Bot"
          git add -- data/cves.db docs/index.html cache/
          if git diff --cached --quiet; then
            echo "No generated data changed."
            exit 0
          fi
          git commit -m "Update vulnerability intelligence"
          git push origin HEAD:master
