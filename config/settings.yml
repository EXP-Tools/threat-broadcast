database:
  dbtype: 'sqlite'
  dbpath: './data/cves.db'
  sqlpath: './script/cves-create.sql'

github:
  graphql: 'https://api.github.com/graphql'
  repo: 'threat-broadcast'
  owner: 'lyy289065406'
  gtk: "<%= ENV['GTK'] %>"                # Github Token，若非空值则使用 Github Actions 发送播报邮件
  auto_commit: False                      # 使用 Github Actions 时不需要开启：自动提交变更到仓库（可自动归档、生成 Github Page）
  
crawler:
  top: 30                                 # 播报时每个来源最多取最新的前 top 个 CVE
  timeout: 20                             # 每次网络请求的超时秒数
  vendor_limit: 100                       # 每个新增厂商来源单次最多收录条数（1–500）
  max_age_days: 90                         # 拒绝把停更来源的旧情报当作新数据；0 为关闭检查
  # 2026-11-01 联网核验：以下来源暂不可用；恢复后删除对应项即可重新启用。
  disabled_sources:
    'Cert 360': 'HTTPS 证书已过期，等待站点修复'
    RedQueen: '旧公开接口跳转到登录页，不再返回情报 JSON'
    vas: '旧站域名无法解析，数据接口 TLS 连接失败'
    CNNVD: '旧页面返回 403；新接口要求签名校验，暂不支持匿名采集'
    QiAnXin: '当前公开 advisory 列表停更，最新情报日期为 2020-07-15'

notify:
  mail_smtp: 'smtp.qq.com'
  mail_user: 'threatbroadcast@qq.com'     # 用于发送播报信息的邮箱账号
  mail_pass: "<%= ENV['MAIL_PASS'] %>"
  qq_user: '123742030'                    # 用于向 QQ 群发送播报信息的 QQ 账号
  qq_pass: "<%= ENV['QQ_PASS'] %>"

